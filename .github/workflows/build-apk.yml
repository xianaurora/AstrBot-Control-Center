name: Build WAI Pad APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "WAI_Pad_*_source.zip"          # 🔁 匹配任意类似文件

permissions:
  contents: read

jobs:
  build:
    name: Build WAI Pad
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # WAI Pad: Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # WAI Pad compileSdk = 35
      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # WAI Pad: AGP 8.7.3, Gradle 8.9
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      # 解压 WAI Pad 源码，并提取版本标签
      - name: Extract WAI Pad source
        shell: bash
        run: |
          set -e

          # 查找匹配的 ZIP 文件
          ZIP_FILE="$(find . -type f -iname "WAI_Pad*_source.zip" | head -1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: WAI Pad source ZIP not found"
            echo "Available ZIP files:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          # 提取版本标签（例如：WAI_Pad_v0.3.4.16_stable_style_detail_fix_source.zip -> v0.3.4.16_stable_style_detail_fix）
          VERSION_TAG="$(basename "$ZIP_FILE" | sed -n 's/^WAI_Pad_\(.*\)_source\.zip$/\1/p')"
          if [ -z "$VERSION_TAG" ]; then
            echo "WARNING: Could not extract version tag, using 'unknown'"
            VERSION_TAG="unknown"
          fi
          echo "Version tag: $VERSION_TAG"
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"

          # 解压
          rm -rf build-src
          mkdir -p build-src
          unzip -q "$ZIP_FILE" -d build-src

          echo "===== Source extracted ====="
          find build-src -maxdepth 4 -type f | sort | head -100

      # 自动寻找 Android 项目目录
      - name: Detect Android project
        shell: bash
        run: |
          set -e
          SETTINGS="$(find build-src -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)"
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) not found"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 显示构建环境
      - name: Environment info
        shell: bash
        run: |
          echo "===== Java ====="
          java -version
          echo "===== Gradle ====="
          gradle --version
          echo "===== Android SDK ====="
          echo "$ANDROID_SDK_ROOT"
          echo "===== Project ====="
          echo "$PROJECT_DIR"
          echo "===== Version tag ====="
          echo "$VERSION_TAG"

      # 编译 Debug APK
      - name: Build WAI Pad Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      # 收集 APK 并重命名（使用动态版本标签）
      - name: Collect APK
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" | head -1)"
          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK not found"
            exit 1
          fi

          # 使用版本标签命名
          FINAL_APK="WAI-Pad-${VERSION_TAG}-debug.apk"
          cp "$APK" "artifacts/$FINAL_APK"
          echo "APK saved as: $FINAL_APK"

          sha256sum "artifacts/$FINAL_APK" | tee artifacts/SHA256SUMS.txt

      # 上传构建产物
      - name: Upload WAI Pad APK
        uses: actions/upload-artifact@v4
        with:
          name: WAI-Pad-${{ env.VERSION_TAG }}-debug
          path: |
            artifacts/WAI-Pad-${{ env.VERSION_TAG }}-debug.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
