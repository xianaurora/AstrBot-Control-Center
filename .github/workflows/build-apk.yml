name: Build WAI Pad APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "WAI_Pad_v0.3.4.15_source.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build WAI Pad
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # WAI Pad: Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # WAI Pad compileSdk = 35
      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # WAI Pad:
      # AGP 8.7.3
      # Gradle 8.9
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      # 解压 WAI Pad
      - name: Extract WAI Pad source
        shell: bash
        run: |
          set -e

          rm -rf build-src
          mkdir -p build-src

          unzip -q WAI_Pad_v0.3.4.15_source.zip -d build-src

          echo "===== Source extracted ====="
          find build-src -maxdepth 4 -type f | sort | head -100

      # 自动寻找 android Gradle 项目
      - name: Detect Android project
        shell: bash
        run: |
          set -e

          SETTINGS="$(find build-src \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 显示构建环境
      - name: Environment info
        shell: bash
        run: |
          echo "===== Java ====="
          java -version

          echo "===== Gradle ====="
          gradle --version

          echo "===== Android SDK ====="
          echo "$ANDROID_SDK_ROOT"

          echo "===== Project ====="
          echo "$PROJECT_DIR"

      # 编译 Debug
      - name: Build WAI Pad Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      # 收集 APK
      - name: Collect APK
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          echo "===== APK files ====="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            | head -1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK not found"
            exit 1
          fi

          echo "Selected APK:"
          echo "$APK"

          cp "$APK" artifacts/WAI-Pad-v0.3.4.15-debug.apk

          sha256sum artifacts/WAI-Pad-v0.3.4.15-debug.apk \
            | tee artifacts/SHA256SUMS.txt

      # 上传编译产物
      - name: Upload WAI Pad APK
        uses: actions/upload-artifact@v4
        with:
          name: WAI-Pad-v0.3.4.15-debug
          path: |
            artifacts/WAI-Pad-v0.3.4.15-debug.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
