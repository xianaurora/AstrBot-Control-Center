name: Build LocalForge APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "LocalForge_source.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build LocalForge
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取当前仓库
      - name: Checkout
        uses: actions/checkout@v6

      # 2. JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. 安装 LocalForge 所需 Android API 35
      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. LocalForge v0.2 使用 AGP 8.7.3
      #    固定 Gradle 8.9
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      # 6. 解压源码
      - name: Extract LocalForge source
        shell: bash
        run: |
          set -e

          rm -rf build-src
          mkdir -p build-src

          unzip -q LocalForge_source.zip -d build-src

          echo "===== ZIP extracted ====="
          find build-src -maxdepth 3 -type f | sort | head -100

      # 7. 自动寻找 settings.gradle.kts
      #    所以 ZIP 外面多套一层目录也没关系
      - name: Detect Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS="$(find build-src -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -1)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Detected project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 8. 显示环境
      - name: Environment info
        shell: bash
        run: |
          echo "===== Java ====="
          java -version

          echo "===== Gradle ====="
          gradle --version

          echo "===== Android SDK ====="
          echo "$ANDROID_SDK_ROOT"

          echo "===== Project ====="
          echo "$PROJECT_DIR"

      # 9. 编译
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      # 10. 找 APK
      - name: Collect APK
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            | head -1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            find "$PROJECT_DIR" -type f -name "*.apk" || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" artifacts/LocalForge-v0.2-debug.apk

          sha256sum artifacts/LocalForge-v0.2-debug.apk \
            | tee artifacts/SHA256SUMS.txt

      # 11. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalForge-v0.2-debug
          path: |
            artifacts/LocalForge-v0.2-debug.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
