name: Build WAI Pad APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare WAI Pad source
        shell: bash
        run: |
          set -euo pipefail

          # 如果源码已经直接上传，则不需要解压
          if find "$GITHUB_WORKSPACE" \
              -type f \
              -path '*/android/settings.gradle.kts' \
              -print -quit | grep -q .; then
            echo "Android 源码已存在，跳过解压"
            exit 0
          fi

          ZIP="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 2 \
              -type f \
              -name 'WAI_Pad*_source.zip' \
              -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::既没有找到 Android 源码，也没有找到 WAI_Pad*_source.zip"
            exit 1
          fi

          echo "找到源码包：$ZIP"

          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/extracted"

          echo "源码解压完成"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -path '*/android/settings.gradle.kts' \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::解压后仍然没有找到 android/settings.gradle.kts"
            echo "当前目录内容："
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Show build environment
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          java -version
          gradle --version
          ls -la

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --warning-mode all

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WAI-Pad-v0.3.1-debug
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
