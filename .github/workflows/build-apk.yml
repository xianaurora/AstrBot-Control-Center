name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 获取仓库文件
        uses: actions/checkout@v6

      - name: 配置 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 解压 Android 源码
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "错误：没有找到源码 ZIP"
            exit 1
          fi

          echo "找到源码：$ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE="$(find extracted -type f -name 'settings.gradle.kts' | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "错误：没有找到 settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android 项目目录：$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: 修复源码兼容问题
        shell: bash
        run: |
          set -e

          MAIN_ACTIVITY="$(find "$PROJECT_DIR" -type f -name 'MainActivity.kt' | head -n 1)"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "错误：没有找到 MainActivity.kt"
            exit 1
          fi

          echo "正在修改：$MAIN_ACTIVITY"

          sed -i \
            's/window\.isFrameRateBoostOnTouchEnabled = true/window.setFrameRateBoostOnTouchEnabled(true)/' \
            "$MAIN_ACTIVITY"

          echo "修改后的代码："
          grep -n "FrameRateBoost" "$MAIN_ACTIVITY"

          if ! grep -q "window.setFrameRateBoostOnTouchEnabled(true)" "$MAIN_ACTIVITY"; then
            echo "错误：源码修复没有成功"
            exit 1
          fi

      - name: 配置 Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: 显示构建环境
        shell: bash
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: 编译 Debug APK
        shell: bash
        run: |
          gradle \
            -p "$PROJECT_DIR" \
            :app:assembleDebug \
            --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: AstrBot-Control-Center-debug
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
