name: Build WAI Pad APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "android/settings.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/android"
          else
            SETTINGS="$(find "$GITHUB_WORKSPACE" \
              -type f \
              -name settings.gradle.kts \
              -path '*/android/settings.gradle.kts' \
              -print -quit)"

            if [ -z "$SETTINGS" ]; then
              echo "::error::没有找到 android/settings.gradle.kts"
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS")"
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Show build environment
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          java -version
          gradle --version

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --warning-mode all

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WAI-Pad-v0.3.1-debug
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
